version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workspace_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      target: builder
    container_name: workspace_api_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-4000}
      DATABASE_URL_JOB_TRACKER: ${DATABASE_URL_JOB_TRACKER:-postgresql://workspace:changeme@postgres:5432/job_tracker}
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    command: npm run dev

  web:
    build:
      context: ./web
      target: builder
    container_name: workspace_web_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data_dev:
