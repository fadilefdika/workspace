version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workspace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # POSTGRES_DB tidak dipakai karena kita buat 3 DB via init script
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workspace_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      DATABASE_URL_JOB_TRACKER: ${DATABASE_URL_JOB_TRACKER:-postgresql://workspace:changeme@postgres:5432/job_tracker}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: workspace_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
